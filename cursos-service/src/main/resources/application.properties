spring.application.name=cursos-service
server.port=8082

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/cursos_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# Nunca alterar el esquema de la base existente (Supabase). Usar database/schema_local.sql para una BD local nueva.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Obligatorio (>= 32 caracteres), compartido con auth-service.
security.jwt.secret=${JWT_SECRET}
