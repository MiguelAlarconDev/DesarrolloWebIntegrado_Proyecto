# Despliegue en Netlify: Base directory = frontend
# Variable de entorno requerida en Netlify: API_URL = https://<gateway-publico>/api
[build]
  command = "npm ci && npm run build && node scripts/write-config.mjs dist/frontend/browser"
  publish = "dist/frontend/browser"

[build.environment]
  NODE_VERSION = "20"

# SPA: todas las rutas van a index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"
