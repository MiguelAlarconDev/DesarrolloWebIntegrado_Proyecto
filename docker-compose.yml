# Levanta TODO el proyecto en una sola maquina para desarrollo o una demo:
#   cp .env.example .env   (y edite los valores)
#   docker compose up --build
# Solo el gateway (8080) y el frontend quedan expuestos; los demas servicios
# viven en la red interna "backend", igual que en la nube.
name: plataforma-cursos

x-java-env: &java-env
  SPRING_PROFILES_ACTIVE: prod
  JWT_SECRET: ${JWT_SECRET}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY}
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cursos_db
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cursos_db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema_local.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cursos_db"]
      interval: 5s
      retries: 10
    networks: [backend]

  auth-service:
    build: { context: ., dockerfile: auth-service/Dockerfile }
    environment:
      <<: *java-env
      WHATSAPP_SERVICE_URL: http://whatsapp-service:8085
      OTP_LOG_IF_WHATSAPP_DOWN: ${OTP_LOG_IF_WHATSAPP_DOWN:-false}
    depends_on: { postgres: { condition: service_healthy } }
    networks: [backend]

  cursos-service:
    build: { context: ., dockerfile: cursos-service/Dockerfile }
    environment: *java-env
    depends_on: { postgres: { condition: service_healthy } }
    networks: [backend]

  pedidos-service:
    build: { context: ., dockerfile: pedidos-service/Dockerfile }
    environment:
      <<: *java-env
      AUTH_SERVICE_URL: http://auth-service:8081
      CURSOS_SERVICE_URL: http://cursos-service:8082
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      MERCADOPAGO_NOTIFICATION_URL: ${MERCADOPAGO_NOTIFICATION_URL:-}
    depends_on: { postgres: { condition: service_healthy } }
    networks: [backend]

  comprobantes-service:
    build: ./comprobantes-service
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    networks: [backend]

  whatsapp-service:
    build: ./whatsapp-service
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    volumes:
      - wwebjs:/data
    networks: [backend]

  gateway-service:
    build: { context: ., dockerfile: gateway-service/Dockerfile }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      AUTH_SERVICE_URL: http://auth-service:8081
      CURSOS_SERVICE_URL: http://cursos-service:8082
      PEDIDOS_SERVICE_URL: http://pedidos-service:8083
      WHATSAPP_SERVICE_URL: http://whatsapp-service:8085
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8088}
      SECURITY_TRUSTED_PROXIES: ${SECURITY_TRUSTED_PROXIES:-127.0.0.1}
    ports: ["8080:8080"]
    depends_on: [auth-service, cursos-service, pedidos-service]
    networks: [backend]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports: ["8088:80"]
    depends_on: [gateway-service]

networks:
  backend:

volumes:
  pgdata:
  wwebjs:
