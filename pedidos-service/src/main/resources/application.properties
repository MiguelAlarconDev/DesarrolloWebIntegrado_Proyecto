# =============================================================================
# pedidos-service - checkout, Mercado Pago, comprobantes y notificaciones
# =============================================================================
spring.application.name=pedidos-service
server.port=${PORT:8083}
server.shutdown=graceful

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cursos_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# ---- Servicios colaboradores (pueden estar en otros servidores)
services.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}
services.cursos.url=${CURSOS_SERVICE_URL:http://localhost:8082}
security.internal-key=${INTERNAL_API_KEY:}

# ---- Mercado Pago (token de prueba TEST-... en desarrollo; nunca en el repositorio)
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.back-url.success=${FRONTEND_URL:http://localhost:5173}/pago/exito
mercadopago.back-url.failure=${FRONTEND_URL:http://localhost:5173}/pago/fallo
mercadopago.back-url.pending=${FRONTEND_URL:http://localhost:5173}/pago/pendiente
# URL publica del webhook (a traves del gateway): https://<gateway>/api/pedidos/webhook
mercadopago.notification-url=${MERCADOPAGO_NOTIFICATION_URL:}

# ---- Expiracion automatica de reservas no pagadas (RF-08)
pedidos.expiracion.intervalo-ms=${RESERVA_CHECK_MS:60000}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
