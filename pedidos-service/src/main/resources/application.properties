spring.application.name=pedidos-service
server.port=8083

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/cursos_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# Nunca alterar el esquema de la base existente (Supabase). Usar database/schema_local.sql para una BD local nueva.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# URLs de Microservicios Colaboradores (127.0.0.1 para evitar latencia IPv6 en Windows)
services.auth.url=${AUTH_SERVICE_URL:http://127.0.0.1:8081}
services.cursos.url=${CURSOS_SERVICE_URL:http://127.0.0.1:8082}

# Mercado Pago
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
mercadopago.api-base-url=${MERCADOPAGO_API_BASE_URL:https://api.mercadopago.com}
mercadopago.back-url.success=${MERCADOPAGO_BACK_URL:http://localhost:4200/checkout}
mercadopago.back-url.failure=${MERCADOPAGO_BACK_URL:http://localhost:4200/checkout}
mercadopago.back-url.pending=${MERCADOPAGO_BACK_URL:http://localhost:4200/checkout}

# Servicio de Envío de Correos (Gmail SMTP)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

# Meta WhatsApp Cloud API (Oficial de Meta / Facebook Graph API)
whatsapp.cloud.api.enabled=${WHATSAPP_CLOUD_ENABLED:true}
whatsapp.cloud.api.base-url=${WHATSAPP_CLOUD_BASE_URL:https://graph.facebook.com}
whatsapp.cloud.api.version=${WHATSAPP_CLOUD_VERSION:v21.0}
whatsapp.cloud.api.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.cloud.api.token=${WHATSAPP_API_TOKEN:}
whatsapp.cloud.api.template-name=${WHATSAPP_CLOUD_TEMPLATE_NAME:}
whatsapp.cloud.api.verify-token=${WHATSAPP_VERIFY_TOKEN:}

# Independent document service (PDF and receipt email)
services.comprobantes.url=${COMPROBANTES_SERVICE_URL:http://127.0.0.1:8084}

# Obligatorio (>= 32 caracteres), compartido con auth-service.
security.jwt.secret=${JWT_SECRET}
