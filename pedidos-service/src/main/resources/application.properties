spring.application.name=pedidos-service
server.port=8083

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/cursos_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Joseelmer31}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# URLs de Microservicios Colaboradores
services.auth.url=http://localhost:8081
services.cursos.url=http://localhost:8082

# Mercado Pago
mercadopago.access-token=TEST-8786075352621630-090217-974d9a4e1da3bffbdc3ec6f5dcdabbf8-3130074680
mercadopago.back-url.success=http://localhost:3000/checkout.html?status=approved
mercadopago.back-url.failure=http://localhost:3000/checkout.html?status=failure
mercadopago.back-url.pending=http://localhost:3000/checkout.html?status=pending

# Servicio de Envío de Correos (Gmail SMTP)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Meta WhatsApp Cloud API (Oficial de Meta / Facebook Graph API)
# Para activar envío autónomo directo por WhatsApp desde el servidor:
# 1. Obtén tu Phone Number ID y Token en developers.facebook.com > WhatsApp > API Setup
# 2. Especifica WHATSAPP_PHONE_NUMBER_ID y WHATSAPP_API_TOKEN
whatsapp.cloud.api.enabled=${WHATSAPP_CLOUD_ENABLED:true}
whatsapp.cloud.api.base-url=${WHATSAPP_CLOUD_BASE_URL:https://graph.facebook.com}
whatsapp.cloud.api.version=${WHATSAPP_CLOUD_VERSION:v21.0}
whatsapp.cloud.api.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.cloud.api.token=${WHATSAPP_API_TOKEN:}
whatsapp.cloud.api.template-name=${WHATSAPP_CLOUD_TEMPLATE_NAME:}
