spring.application.name=auth-service
server.port=8081

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/cursos_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Joseelmer}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# WhatsApp 2FA Provider (Green-API)
whatsapp.provider=${WHATSAPP_PROVIDER:greenapi}
whatsapp.greenapi.id-instance=${WHATSAPP_GREENAPI_ID_INSTANCE:710722793693}
whatsapp.greenapi.api-token-instance=${WHATSAPP_GREENAPI_API_TOKEN_INSTANCE:14f4e7176bbf41bbbe2cb2bae0681ecf01a448b4ef3347ac82}
whatsapp.greenapi.host=${WHATSAPP_GREENAPI_HOST:https://7107.api.greenapi.com}
whatsapp.meta.default-phone=${WHATSAPP_META_PHONE:+51935300159}
whatsapp.meta.enabled=${WHATSAPP_META_ENABLED:true}
