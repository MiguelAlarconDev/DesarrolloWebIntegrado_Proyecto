# =============================================================================
# auth-service - usuarios, JWT y doble factor (2FA por WhatsApp)
# =============================================================================
spring.application.name=auth-service
server.port=${PORT:8081}
server.shutdown=graceful

# ---- PostgreSQL (ej. jdbc:postgresql://host:5432/cursos_db?sslmode=require)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cursos_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# ---- JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# ---- Seguridad
security.jwt.secret=${JWT_SECRET:dev-secret-change-me-please-32-chars}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
security.internal-key=${INTERNAL_API_KEY:}
services.whatsapp.url=${WHATSAPP_SERVICE_URL:http://localhost:8085}

# ---- Salud
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
security.otp.log-if-whatsapp-down=${OTP_LOG_IF_WHATSAPP_DOWN:false}
