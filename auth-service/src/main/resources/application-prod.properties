# Perfil de produccion: sin valores por defecto para secretos (el servicio no arranca si faltan)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
security.jwt.secret=${JWT_SECRET}
services.whatsapp.url=${WHATSAPP_SERVICE_URL}
security.otp.log-if-whatsapp-down=false
